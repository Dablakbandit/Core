name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Spigot artifacts in pom.xml that only BuildTools can produce
  SPIGOT_LEGACY: 1.16.4      # org.spigotmc:spigot / spigot-api
  SPIGOT_MODERN: 26.1.1      # org.spigotmc:minecraft-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 11 runs BuildTools for 1.16.4; 25 (listed last, so the default) builds 26.x and Core
          java-version: |
            11
            25

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ env.SPIGOT_LEGACY }}-${{ env.SPIGOT_MODERN }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            m2-${{ env.SPIGOT_LEGACY }}-${{ env.SPIGOT_MODERN }}-

      - name: Build Spigot with BuildTools (skipped when cached)
        run: |
          repo=~/.m2/repository/org/spigotmc
          missing() { [ ! -f "$repo/$1/$2-R0.1-SNAPSHOT/$1-$2-R0.1-SNAPSHOT.jar" ]; }
          mkdir -p "$RUNNER_TEMP/buildtools" && cd "$RUNNER_TEMP/buildtools"
          if missing spigot "$SPIGOT_LEGACY" || missing minecraft-server "$SPIGOT_MODERN"; then
            curl -fsSLo BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          fi
          if missing spigot "$SPIGOT_LEGACY"; then
            "$JAVA_HOME_11_X64/bin/java" -jar BuildTools.jar --rev "$SPIGOT_LEGACY"
          fi
          if missing minecraft-server "$SPIGOT_MODERN"; then
            "$JAVA_HOME_25_X64/bin/java" -jar BuildTools.jar --rev "$SPIGOT_MODERN"
          fi
          find ~/.m2/repository/org/spigotmc -name "*.jar" | sed "s#^$HOME/.m2/repository/#::notice title=BuildTools installed::#"
          find "$RUNNER_TEMP/buildtools" -maxdepth 3 -name "*.jar" -newer BuildTools.jar 2>/dev/null | sed "s#^#::notice title=BuildTools output::#" || true

      - name: Build Core
        run: |
          set -o pipefail
          mvn -B -ntp package 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Annotate compile errors
        if: failure()
        run: |
          # "[ERROR] /abs/path/File.java:[line,col] message" -> inline annotations on the commit / PR
          grep -E '^\[ERROR\] /.*\.java:\[[0-9]+,[0-9]+\]' "$RUNNER_TEMP/build.log" | sort -u | head -50 |
          sed -E "s#^\[ERROR\] $GITHUB_WORKSPACE/##; s#^([^:]+):\[([0-9]+),([0-9]+)\] (.*)#::error file=\1,line=\2,col=\3::\4#" || true
          grep -E '^\[ERROR\]' "$RUNNER_TEMP/build.log" | grep -vE '\.java:\[' | head -5 | sed -E 's#^\[ERROR\] ?#::error::#' || true

      - uses: actions/upload-artifact@v5
        with:
          name: core-${{ github.sha }}
          path: target/core-*.jar
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/core-*.jar --title "$GITHUB_REF_NAME" --generate-notes
